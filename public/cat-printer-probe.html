<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cat printer probe</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 24px; max-width: 900px; }
  button { font: inherit; padding: 6px 12px; margin: 0 8px 8px 0; }
  pre { background: #f4f4f4; padding: 12px; overflow: auto; max-height: 50vh; font-size: 12px; }
  .row { margin: 12px 0; }
  label { margin-right: 12px; }
</style>
</head>
<body>
<h1>Cat printer probe</h1>
<p>Connects to a cat printer over Web Bluetooth, lists every service and characteristic it exposes, subscribes to notifications, and lets you send single test commands. Open this file in Chrome and keep the console open as well.</p>

<div class="row">
  <button id="connect">Connect and list services</button>
  <button id="disconnect" disabled>Disconnect</button>
</div>
<div class="row">
  <button id="state" disabled>Get device state (A3)</button>
  <button id="info" disabled>Get device info (A8)</button>
  <button id="feed" disabled>Feed 40 rows (A1)</button>
  <button id="pattern" disabled>Print test pattern (full job)</button>
</div>
<div class="row">
  <label>Energy <input id="energy" type="number" value="12000" min="0" max="65535" style="width:7em"></label>
  <label>Speed <input id="speed" type="number" value="32" min="0" max="255" style="width:5em"></label>
  <label>Write delay ms <input id="delay" type="number" value="30" min="0" max="500" style="width:5em"></label>
</div>
<pre id="log"></pre>

<script>
const SERVICE = '0000ae30-0000-1000-8000-00805f9b34fb';
const WRITE = '0000ae01-0000-1000-8000-00805f9b34fb';
const NOTIFY = '0000ae02-0000-1000-8000-00805f9b34fb';
const EXTRA = '0000ae3a-0000-1000-8000-00805f9b34fb';

const logEl = document.getElementById('log');
const log = (...parts) => { const line = parts.join(' '); logEl.textContent += line + '\n'; logEl.scrollTop = logEl.scrollHeight; console.log(line); };
const hex = (bytes) => Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join(' ');

/* CRC-8, polynomial 0x07, init 0, over the payload only */
const CRC = new Uint8Array(256);
for (let i = 0; i < 256; i++) { let c = i; for (let b = 0; b < 8; b++) c = c & 0x80 ? ((c << 1) ^ 0x07) & 0xff : (c << 1) & 0xff; CRC[i] = c; }
const crc8 = (bytes) => { let c = 0; for (const b of bytes) c = CRC[(c ^ b) & 0xff]; return c; };
const packet = (cmd, payload) => Uint8Array.from([0x51, 0x78, cmd, 0x00, payload.length & 0xff, payload.length >> 8, ...payload, crc8(payload), 0xff]);
const reverse = (b) => { b = ((b & 0xf0) >> 4) | ((b & 0x0f) << 4); b = ((b & 0xcc) >> 2) | ((b & 0x33) << 2); return ((b & 0xaa) >> 1) | ((b & 0x55) << 1); };

let device, server, write, notify;

async function connect() {
  /* The picker filters on advertised UUIDs, which a cat printer does not always include, so accept
     every device and let the user pick it by name. optionalServices lists what we may access afterwards. */
  device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: [SERVICE, EXTRA, 'battery_service', 'device_information', 'generic_access'] });
  log('Device:', device.name, device.id);
  device.addEventListener('gattserverdisconnected', () => { log('Disconnected'); setButtons(false); });
  server = await device.gatt.connect();
  const services = await server.getPrimaryServices();
  for (const service of services) {
    log('Service', service.uuid);
    const characteristics = await service.getCharacteristics();
    for (const c of characteristics) {
      const p = c.properties;
      const props = ['read', 'write', 'writeWithoutResponse', 'notify', 'indicate'].filter((k) => p[k]).join(',');
      log('  Characteristic', c.uuid, '[' + props + ']');
      if (p.read) { try { const v = await c.readValue(); log('    value:', hex(new Uint8Array(v.buffer))); } catch (e) { log('    read failed:', e.message); } }
    }
  }
  let service;
  try { service = await server.getPrimaryService(SERVICE); } catch (e) { log('No AE30 service on this device:', e.message); return; }
  write = await service.getCharacteristic(WRITE);
  notify = await service.getCharacteristic(NOTIFY);
  await notify.startNotifications();
  notify.addEventListener('characteristicvaluechanged', (e) => {
    const bytes = new Uint8Array(e.target.value.buffer);
    let note = '';
    if (bytes[2] === 0xae && bytes[6] === 0x10) note = '  <- PAUSE';
    if (bytes[2] === 0xae && bytes[6] === 0x00) note = '  <- RESUME';
    log('Notify:', hex(bytes) + note);
  });
  log('Subscribed to notifications on AE02, writing ' + (write.properties.write ? 'with' : 'without') + ' response on AE01');
  setButtons(true);
}

async function send(bytes, label) {
  log('Write ' + (label || '') + ':', hex(bytes));
  /* AE01 is writeWithoutResponse only on some models, such as the MX10 */
  if (write.properties.write) {
    await write.writeValueWithResponse(bytes);
  } else {
    await write.writeValueWithoutResponse(bytes);
  }
  const delay = Number(document.getElementById('delay').value) || 0;
  if (delay) await new Promise((r) => setTimeout(r, delay));
}

function setButtons(on) {
  for (const id of ['disconnect', 'state', 'info', 'feed', 'pattern']) document.getElementById(id).disabled = !on;
  document.getElementById('connect').disabled = on;
}

document.getElementById('connect').onclick = () => connect().catch((e) => log('Error:', e.message));
document.getElementById('disconnect').onclick = () => device && device.gatt.disconnect();
document.getElementById('state').onclick = () => send(packet(0xa3, [0x00]), 'state').catch((e) => log('Error:', e.message));
document.getElementById('info').onclick = () => send(packet(0xa8, [0x00]), 'info').catch((e) => log('Error:', e.message));
document.getElementById('feed').onclick = () => send(packet(0xa1, [40, 0]), 'feed').catch((e) => log('Error:', e.message));

document.getElementById('pattern').onclick = async () => {
  try {
    const energy = Number(document.getElementById('energy').value);
    const speed = Number(document.getElementById('speed').value);
    await send(packet(0xa3, [0x00]), 'state');
    await send(packet(0xa4, [0x32]), 'dpi');
    await send(packet(0xbd, [speed & 0xff]), 'speed');
    await send(packet(0xaf, [energy & 0xff, energy >> 8]), 'energy');
    await send(packet(0xbe, [0x01]), 'apply energy');
    await send(packet(0xa9, [0x00]), 'update');
    await send(packet(0xa6, [0xaa, 0x55, 0x17, 0x38, 0x44, 0x5f, 0x5f, 0x5f, 0x44, 0x38, 0x2c]), 'lattice start');
    /* 64 rows: a frame, a diagonal, and 8-dot blocks, MSB-first rows reversed per byte for the printer */
    for (let y = 0; y < 64; y++) {
      const row = new Uint8Array(48);
      for (let x = 0; x < 384; x++) {
        const frame = y < 2 || y > 61 || x < 2 || x > 381;
        const diagonal = Math.abs(x - y * 6) < 3;
        const blocks = y > 40 && ((x >> 3) & 1) === 0 && y < 56;
        if (frame || diagonal || blocks) row[x >> 3] |= 0x80 >> (x & 7);
      }
      await send(packet(0xa2, Array.from(row, reverse)), 'row ' + y);
    }
    await send(packet(0xa6, [0xaa, 0x55, 0x17, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x17]), 'lattice end');
    await send(packet(0xa1, [96, 0]), 'final feed');
    log('Test pattern sent');
  } catch (e) { log('Error:', e.message); }
};
</script>
</body>
</html>
